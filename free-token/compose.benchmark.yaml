services:
  freetoken-bench:
    image: ${FREETOKEN_IMAGE}
    restart: "no"

    env_file:
      - stack.env

    volumes:
      - type: volume
        source: free-token-cache
        target: /cache

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}

      XDG_CACHE_HOME: /cache
      HF_HOME: /cache/huggingface
      TRITON_CACHE_DIR: /cache/triton

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        set -eu

        PROFILE="/cache/freetoken/benchbw.json"

        case "$${BENCHMARK_MODE:-if-missing}" in
          always)
            echo "Running FreeToken hardware benchmark..."
            exec ft bench bw --model "$${MODEL:-openai/gpt-oss-20b}"
            ;;

          if-missing)
            if [ ! -s "$$PROFILE" ]; then
              echo "No benchmark profile found. Generating..."
              exec ft bench bw --model "$${MODEL:-openai/gpt-oss-20b}"
            fi

            echo "Benchmark profile already exists:"
            echo "$$PROFILE"
            ;;

          never)
            echo "Benchmark disabled."
            ;;

          *)
            echo "Invalid BENCHMARK_MODE=$${BENCHMARK_MODE}" >&2
            exit 1
            ;;
        esac