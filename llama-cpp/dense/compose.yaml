---
services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: llama-cpp

    environment:
      # -----------------------------------------------------------------------
      # Model / Hugging Face
      # -----------------------------------------------------------------------
      LLAMA_CACHE: /cache

      # These three values are supplied by the selected --env-file.
      LLAMA_ARG_HF_REPO: ${LLAMA_ARG_HF_REPO:?set LLAMA_ARG_HF_REPO in --env-file}
      LLAMA_ARG_HF_FILE: ${LLAMA_ARG_HF_FILE:?set LLAMA_ARG_HF_FILE in --env-file}
      LLAMA_ARG_ALIAS: ${LLAMA_ARG_ALIAS:-home-assistant}

      # Voice-only Home Assistant: do not download/load a multimodal projector.
      LLAMA_ARG_MMPROJ_AUTO: ${LLAMA_ARG_MMPROJ_AUTO:-false}

      # -----------------------------------------------------------------------
      # Server
      # -----------------------------------------------------------------------
      LLAMA_ARG_HOST: ${LLAMA_ARG_HOST:-0.0.0.0}
      LLAMA_ARG_PORT: ${LLAMA_ARG_PORT:-8080}
      LLAMA_ARG_UI: ${LLAMA_ARG_UI:-false}
      LLAMA_ARG_API_PREFIX: ${LLAMA_ARG_API_PREFIX:-}
      LLAMA_ARG_TIMEOUT: ${LLAMA_ARG_TIMEOUT:-3600}
      LLAMA_ARG_THREADS_HTTP: ${LLAMA_ARG_THREADS_HTTP:--1}
      LLAMA_ARG_ENDPOINT_METRICS: ${LLAMA_ARG_ENDPOINT_METRICS:-true}
      LLAMA_ARG_ENDPOINT_SLOTS: ${LLAMA_ARG_ENDPOINT_SLOTS:-true}
      LLAMA_ARG_ENDPOINT_PROPS: ${LLAMA_ARG_ENDPOINT_PROPS:-false}

      # -----------------------------------------------------------------------
      # Context / generation
      # -----------------------------------------------------------------------
      # Current HA prompt is already >5.6K tokens, so keep 8K.
      LLAMA_ARG_CTX_SIZE: ${LLAMA_ARG_CTX_SIZE:-8192}
      LLAMA_ARG_N_PREDICT: ${LLAMA_ARG_N_PREDICT:-512}
      LLAMA_ARG_N_PARALLEL: ${LLAMA_ARG_N_PARALLEL:-1}

      # i7-6700: 4 physical / 8 logical cores.
      LLAMA_ARG_THREADS: ${LLAMA_ARG_THREADS:-4}
      LLAMA_ARG_THREADS_BATCH: ${LLAMA_ARG_THREADS_BATCH:-8}

      LLAMA_ARG_BATCH: ${LLAMA_ARG_BATCH:-1024}
      LLAMA_ARG_UBATCH: ${LLAMA_ARG_UBATCH:-512}
      LLAMA_ARG_FLASH_ATTN: ${LLAMA_ARG_FLASH_ATTN:-on}
      LLAMA_ARG_CONT_BATCHING: ${LLAMA_ARG_CONT_BATCHING:-true}
      LLAMA_ARG_PERF: ${LLAMA_ARG_PERF:-true}

      # -----------------------------------------------------------------------
      # RTX A2000 6 GB / CUDA
      # -----------------------------------------------------------------------
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      LLAMA_ARG_N_GPU_LAYERS: ${LLAMA_ARG_N_GPU_LAYERS:-all}

      # These 4B models are dense/hybrid, not the GPT-OSS MoE setup.
      LLAMA_ARG_N_CPU_MOE: ${LLAMA_ARG_N_CPU_MOE:-0}
      LLAMA_ARG_CPU_MOE: ${LLAMA_ARG_CPU_MOE:-false}

      LLAMA_ARG_SPLIT_MODE: ${LLAMA_ARG_SPLIT_MODE:-none}
      LLAMA_ARG_MAIN_GPU: ${LLAMA_ARG_MAIN_GPU:-0}

      # Fit against VRAM left free by Whisper and retain a safety margin.
      LLAMA_ARG_FIT: ${LLAMA_ARG_FIT:-on}
      LLAMA_ARG_FIT_TARGET: ${LLAMA_ARG_FIT_TARGET:-512}
      LLAMA_ARG_FIT_CTX: ${LLAMA_ARG_FIT_CTX:-8192}

      # -----------------------------------------------------------------------
      # KV cache / memory
      # -----------------------------------------------------------------------
      LLAMA_ARG_KV_OFFLOAD: ${LLAMA_ARG_KV_OFFLOAD:-true}
      LLAMA_ARG_CACHE_TYPE_K: ${LLAMA_ARG_CACHE_TYPE_K:-f16}
      LLAMA_ARG_CACHE_TYPE_V: ${LLAMA_ARG_CACHE_TYPE_V:-f16}
      LLAMA_ARG_LOAD_MODE: ${LLAMA_ARG_LOAD_MODE:-auto}
      LLAMA_ARG_REPACK: ${LLAMA_ARG_REPACK:-true}

      # -----------------------------------------------------------------------
      # Prompt cache
      # -----------------------------------------------------------------------
      LLAMA_ARG_CACHE_PROMPT: ${LLAMA_ARG_CACHE_PROMPT:-true}
      LLAMA_ARG_CACHE_RAM: ${LLAMA_ARG_CACHE_RAM:-4096}
      LLAMA_ARG_KV_UNIFIED: ${LLAMA_ARG_KV_UNIFIED:-true}
      LLAMA_ARG_CACHE_IDLE_SLOTS: ${LLAMA_ARG_CACHE_IDLE_SLOTS:-true}
      LLAMA_ARG_CTX_CHECKPOINTS: ${LLAMA_ARG_CTX_CHECKPOINTS:-32}
      LLAMA_ARG_CHECKPOINT_MIN_SPACING_NT: ${LLAMA_ARG_CHECKPOINT_MIN_SPACING_NT:-8192}

      # -----------------------------------------------------------------------
      # Chat / tool calling / reasoning
      # -----------------------------------------------------------------------
      LLAMA_ARG_JINJA: ${LLAMA_ARG_JINJA:-true}
      LLAMA_ARG_SKIP_CHAT_PARSING: ${LLAMA_ARG_SKIP_CHAT_PARSING:-false}

      # For voice latency use direct/non-thinking mode.
      # Current llama.cpp prefers --reasoning off over enable_thinking kwargs.
      LLAMA_ARG_REASONING: ${LLAMA_ARG_REASONING:-off}
      LLAMA_ARG_THINK_BUDGET: ${LLAMA_ARG_THINK_BUDGET:--1}

      LLAMA_ARG_PREFILL_ASSISTANT: ${LLAMA_ARG_PREFILL_ASSISTANT:-true}
      LLAMA_ARG_SPEC_TYPE: ${LLAMA_ARG_SPEC_TYPE:-none}

      # -----------------------------------------------------------------------
      # Logging
      # -----------------------------------------------------------------------
      LLAMA_ARG_LOG_VERBOSITY: ${LLAMA_ARG_LOG_VERBOSITY:-3}
      LLAMA_ARG_LOG_FILE: ${LLAMA_ARG_LOG_FILE:-}
      LLAMA_ARG_LOG_PREFIX: ${LLAMA_ARG_LOG_PREFIX:-true}
      LLAMA_ARG_LOG_TIMESTAMPS: ${LLAMA_ARG_LOG_TIMESTAMPS:-true}
      LLAMA_ARG_LOG_COLORS: ${LLAMA_ARG_LOG_COLORS:-auto}
      LLAMA_ARG_OFFLINE: ${LLAMA_ARG_OFFLINE:-false}

    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host

    volumes:
      - type: volume
        source: llama-cpp-cache
        target: /cache

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    restart: unless-stopped

volumes:
  llama-cpp-cache:
